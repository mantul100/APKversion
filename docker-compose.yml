version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jagopos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env.example
    depends_on:
      - db
    ports:
      - "4000:4000"
volumes:
  pgdata:
