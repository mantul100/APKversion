<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JagoPOS • Sistem Kasir Cerdas</title>
  <link rel="icon" type="image/png" href="favicon-jagopos.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <link rel="stylesheet" href="frontend/style.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<div id="app-root"></div>

<!-- Core scripts -->
<script>
  // API_URL points to your Apps Script web app
  const API_URL = "https://script.google.com/macros/s/AKfycbyWZvWv1DTxILqNYCVVcyaA-DHSVuIsStpqd20KLly2Tc0ZnSEFie8XlU3lnzvKQicP/exec";
  window.API_URL = API_URL;
  // Simple global holder for session
  window.JAGO_APP = { session: null };
</script>
<script src="frontend/idb.js"></script>
<script src="frontend/pos-offline.js"></script>
<script src="frontend/pos-ui.js"></script>
<script src="frontend/login.js"></script>

<script>
  // mount minimal SPA that shows login or main app
  (function(){
    const root = document.getElementById('app-root');
    function renderLogin(){ root.innerHTML = '';
      const div = document.createElement('div'); div.className='min-h-screen flex items-center justify-center p-6';
      div.innerHTML = `
        <div class="w-full max-w-md bg-white rounded-2xl p-6 shadow">
          <h2 class="text-2xl font-bold text-slate-800 mb-4">JagoPOS — Login</h2>
          <input id="loginUser" class="w-full p-3 border rounded mb-3" placeholder="Username or Email">
          <input id="loginPass" type="password" class="w-full p-3 border rounded mb-4" placeholder="Password">
          <div class="flex gap-2">
            <button id="btnLogin" class="flex-1 bg-blue-600 text-white py-3 rounded">Masuk</button>
            <button id="btnRegister" class="flex-1 border border-slate-200 py-3 rounded">Daftar</button>
          </div>
          <div id="loginMsg" class="text-sm text-red-500 mt-3 hidden"></div>
        </div>`;
      root.appendChild(div);
      document.getElementById('btnLogin').onclick = async ()=>{
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        if(!u||!p){ showLoginMsg('Isi username & password'); return; }
        showLoginMsg('Mengecek...');
        try{
          const res = await callAPI('cekLoginTenant',{username:u,password:p});
          if(res && res.status==='sukses'){ window.JAGO_APP.session = res; localStorage.setItem('jagopos_data', JSON.stringify(res)); loadApp(); }
          else showLoginMsg(res.pesan || 'Gagal login');
        }catch(e){ showLoginMsg('Koneksi gagal'); }
      };
      document.getElementById('btnRegister').onclick = ()=>{ renderRegister(); };
      function showLoginMsg(t){ const el=document.getElementById('loginMsg'); el.innerText=t; el.classList.remove('hidden'); }
    }

    function renderRegister(){ root.innerHTML=''; const div=document.createElement('div'); div.className='min-h-screen flex items-center justify-center p-6';
      div.innerHTML = `
        <div class="w-full max-w-lg bg-white rounded-2xl p-6 shadow">
          <h2 class="text-2xl font-bold text-slate-800 mb-4">Daftar Toko Baru</h2>
          <div class="grid grid-cols-1 gap-3">
            <input id="regNama" class="p-3 border rounded" placeholder="Nama Toko">
            <input id="regEmail" class="p-3 border rounded" placeholder="Email Admin">
            <input id="regUser" class="p-3 border rounded" placeholder="Username Admin">
            <input id="regPass" type="password" class="p-3 border rounded" placeholder="Password Admin">
            <input id="regPIN" class="p-3 border rounded" placeholder="Manager PIN (opsional)">
            <div class="flex gap-2">
              <button id="btnDoRegister" class="flex-1 bg-emerald-600 text-white py-3 rounded">Daftar</button>
              <button id="btnBackLogin" class="flex-1 border py-3 rounded">Kembali</button>
            </div>
            <div id="regMsg" class="text-sm text-red-500 hidden"></div>
          </div>
        </div>`;
      root.appendChild(div);
      document.getElementById('btnBackLogin').onclick=()=>renderLogin();
      document.getElementById('btnDoRegister').onclick=async ()=>{
        const nama=document.getElementById('regNama').value.trim();
        const email=document.getElementById('regEmail').value.trim();
        const user=document.getElementById('regUser').value.trim();
        const pass=document.getElementById('regPass').value.trim();
        const pin=document.getElementById('regPIN').value.trim();
        if(!nama||!email||!user||!pass){ showRegMsg('Lengkapi semua kolom'); return; }
        showRegMsg('Membuat database...');
        try{
          const res = await callAPI('registerTokoBaru',{namaToko:nama,email:email,username:user,password:pass,managerPin:pin});
          if(res && res.status==='sukses'){ localStorage.setItem('jagopos_data', JSON.stringify({sheetId:res.sheetId, nama:user, role:'Admin', toko:nama})); window.JAGO_APP.session = {sheetId:res.sheetId, nama:user, role:'Admin', toko:nama}; loadApp(); }
          else showRegMsg(res.pesan||'Gagal buat toko');
        }catch(e){ showRegMsg('Koneksi gagal'); }
      };
      function showRegMsg(t){ const el=document.getElementById('regMsg'); el.innerText=t; el.classList.remove('hidden'); }
    }

    function loadApp(){ // simple loader: redirect to main UI already implemented in pos-ui
      location.href = 'index.html'; // keep same page; pos-ui will detect sessionUser in localStorage
    }

    // startup
    var saved = localStorage.getItem('jagopos_data');
    if(saved){ try{ window.JAGO_APP.session = JSON.parse(saved); loadApp(); }catch(e){ renderLogin(); } } else renderLogin();
  })();
</script>

</body>
</html>
