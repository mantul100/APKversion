<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JagoPOS • Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;background:#f1f5f9}
    .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,0.06);padding:14px}
    .hidden{display:none}
    .product-card{transition:all .12s; border-radius:.75rem; padding:12px; background:white}
    .product-card:hover{transform:translateY(-4px); box-shadow:0 10px 30px rgba(2,6,23,0.06)}
  </style>
</head>
<body>
  <div id="app-root" class="min-h-screen flex items-center justify-center p-6"></div>

<script>
  // IMPORTANT: replace the placeholder with your deployed Apps Script Web App URL AFTER you deploy Code.gs
  const API_URL = "https://script.google.com/macros/s/AKfycbyWZvWv1DTxILqNYCVVcyaA-DHSVuIsStpqd20KLly2Tc0ZnSEFie8XlU3lnzvKQicP/exec";
  window.API_URL = API_URL;
  window.JAGO_APP = { session: null };

  // callAPI generic
  async function callAPI(action, data, sheetId){
    var payload = { action: action, sheetId: sheetId || (window.JAGO_APP && window.JAGO_APP.session && window.JAGO_APP.session.sheetId) || null, data: data || {} };
    var res = await fetch(window.API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
    return res.ok ? await res.json() : { status:'error', pesan:'HTTP '+res.status };
  }
</script>

<script>
/* IndexedDB tiny wrapper */
(function(){
  const DBNAME='JagoPOS_IDB_v1', DBVER=1, STORE='sync_queue';
  function openDB(){ return new Promise((res,rej)=>{ var rq=indexedDB.open(DBNAME,DBVER); rq.onupgradeneeded=function(e){ var db=e.target.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); }; rq.onsuccess=function(){ res(rq.result); }; rq.onerror=function(){ rej(rq.error); }; }); }
  window.JagoIDB = {
    add: async function(obj){ var db=await openDB(); return new Promise((res,rej)=>{ var tx=db.transaction(STORE,'readwrite'); var s=tx.objectStore(STORE); s.add(obj).onsuccess=()=>res(true); tx.oncomplete=function(){ db.close(); }; tx.onerror=function(){ rej(tx.error); }; }); },
    getAll: async function(){ var db=await openDB(); return new Promise((res,rej)=>{ var tx=db.transaction(STORE,'readonly'); var s=tx.objectStore(STORE); var r=s.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); tx.oncomplete=function(){ db.close(); }; }); },
    del: async function(id){ var db=await openDB(); return new Promise((res,rej)=>{ var tx=db.transaction(STORE,'readwrite'); var s=tx.objectStore(STORE); s.delete(id).onsuccess=()=>res(true); tx.oncomplete=function(){ db.close(); }; tx.onerror=()=>rej(tx.error); }); },
    put: async function(obj){ var db=await openDB(); return new Promise((res,rej)=>{ var tx=db.transaction(STORE,'readwrite'); var s=tx.objectStore(STORE); s.put(obj).onsuccess=()=>res(true); tx.oncomplete=function(){ db.close(); }; tx.onerror=()=>rej(tx.error); }); }
  };
})();
</script>

<script>
/* offline sync */
(function(){
  async function syncQueued(){
    try{
      const queued = await JagoIDB.getAll();
      if(!queued || !queued.length) return;
      for(const item of queued){
        try{
          const res = await callAPI(item.payload.action, item.payload.data, item.payload.sheetId);
          if(res && (res.status==='sukses' || res.status==='pending' || res.status==='processed')){
            await JagoIDB.del(item.id);
          } else {
            item.attempts = (item.attempts||0)+1; await JagoIDB.put(item);
          }
        }catch(e){}
      }
    }catch(e){ console.warn('syncQueued', e); }
  }
  window.addEventListener('online', syncQueued);
  window.addEventListener('load', ()=>{ if(navigator.onLine) setTimeout(syncQueued,1500); });
})();
</script>

<script>
/* Minimal SPA: login, register, main placeholder */
(function(){
  const root = document.getElementById('app-root');

  function showLogin(){
    root.innerHTML = `
      <div class="card w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4">JagoPOS — Login</h2>
        <input id="loginUser" class="w-full p-3 border rounded mb-3" placeholder="Username">
        <input id="loginPass" type="password" class="w-full p-3 border rounded mb-4" placeholder="Password">
        <div class="flex gap-2">
          <button id="btnLogin" class="flex-1 bg-blue-600 text-white py-3 rounded">Masuk</button>
          <button id="btnRegister" class="flex-1 border py-3 rounded">Daftar</button>
        </div>
        <div id="loginMsg" class="text-sm text-red-500 mt-3 hidden"></div>
      </div>`;
    document.getElementById('btnLogin').onclick = async ()=>{
      const u=document.getElementById('loginUser').value.trim();
      const p=document.getElementById('loginPass').value.trim();
      if(!u||!p){ showMsg('loginMsg','Isi username & password'); return; }
      showMsg('loginMsg','Mengecek...');
      try{
        const saved = localStorage.getItem('jagopos_data');
        let sheetId = null;
        if(saved){ sheetId = JSON.parse(saved).sheetId; } // if prior registered, use it
        // prompt for sheetId if not known (simple)
        if(!sheetId){ sheetId = prompt('Masukkan Sheet ID tenant (sheetId toko Anda)'); if(!sheetId){ showMsg('loginMsg','Butuh sheetId tenant'); return; } }
        const res = await callAPI('cekLoginTenant', { username:u, password:p }, sheetId);
        if(res && res.status==='sukses'){ window.JAGO_APP.session = res; localStorage.setItem('jagopos_data', JSON.stringify(res)); showMain(); } else showMsg('loginMsg', res.pesan || 'Gagal login');
      }catch(e){ showMsg('loginMsg','Koneksi gagal'); }
    };
    document.getElementById('btnRegister').onclick = showRegister;
    function showMsg(id, text){ const el=document.getElementById(id); el.innerText=text; el.classList.remove('hidden'); }
  }

  function showRegister(){
    root.innerHTML = `
      <div class="card w-full max-w-lg">
        <h2 class="text-2xl font-bold mb-4">Daftar Toko Baru</h2>
        <div class="grid gap-3">
          <input id="regNama" class="p-3 border rounded" placeholder="Nama Toko">
          <input id="regEmail" class="p-3 border rounded" placeholder="Email Admin">
          <input id="regUser" class="p-3 border rounded" placeholder="Username Admin">
          <input id="regPass" type="password" class="p-3 border rounded" placeholder="Password Admin">
          <input id="regPIN" class="p-3 border rounded" placeholder="Manager PIN (opsional)">
          <div class="flex gap-2">
            <button id="btnDoRegister" class="flex-1 bg-emerald-600 text-white py-3 rounded">Daftar</button>
            <button id="btnBack" class="flex-1 border py-3 rounded">Kembali</button>
          </div>
          <div id="regMsg" class="text-sm text-red-500 hidden"></div>
        </div>
      </div>`;
    document.getElementById('btnBack').onclick = showLogin;
    document.getElementById('btnDoRegister').onclick = async ()=>{
      const nama=document.getElementById('regNama').value.trim();
      const email=document.getElementById('regEmail').value.trim();
      const user=document.getElementById('regUser').value.trim();
      const pass=document.getElementById('regPass').value.trim();
      const pin=document.getElementById('regPIN').value.trim();
      if(!nama||!email||!user||!pass){ showReg('Lengkapi semua kolom'); return; }
      showReg('Membuat database...');
      try{
        const res = await callAPI('registerTokoBaru',{ namaToko:nama, email:email, username:user, password:pass, managerPin:pin });
        if(res && res.status==='sukses'){
          const sess = { sheetId: res.sheetId, nama: user, role: 'Admin', toko: nama };
          localStorage.setItem('jagopos_data', JSON.stringify(sess));
          window.JAGO_APP.session = sess;
          showMain();
        } else showReg(res.pesan || 'Gagal buat toko');
      }catch(e){ showReg('Koneksi gagal'); }
    };
    function showReg(t){ const el=document.getElementById('regMsg'); el.innerText=t; el.classList.remove('hidden'); }
  }

  function showMain(){
    const s = JSON.parse(localStorage.getItem('jagopos_data')||'{}');
    root.innerHTML = `
      <div class="w-full max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-4">
          <div><h1 class="text-2xl font-bold">JagoPOS • ${s.toko||''}</h1><div class="text-sm text-slate-500">Kasir: ${s.nama||''} • Role: ${s.role||''}</div></div>
          <div>
            <button id="btnLogout" class="px-3 py-2 border rounded mr-2">Logout</button>
            <button id="btnOpenPos" class="px-3 py-2 bg-blue-600 text-white rounded">Buka POS</button>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="col-span-2 card" id="katalogArea">Memuat katalog...</div>
          <div class="card" id="sidebarArea">Sidebar • Sync: <span id="syncSummary">OK</span></div>
        </div>
      </div>`;
    document.getElementById('btnLogout').onclick = ()=>{ localStorage.removeItem('jagopos_data'); window.location.reload(); };
    document.getElementById('btnOpenPos').onclick = ()=>{ alert('POS penuh akan ditambahkan pada PR final. Untuk sekarang, gunakan demo basic.'); };
    // load katalog sample from spreadsheet if exists (basic)
    loadKatalog();
  }

  async function loadKatalog(){
    const s = JSON.parse(localStorage.getItem('jagopos_data')||'{}');
    const area = document.getElementById('katalogArea');
    if(!s.sheetId){ area.innerHTML = '<div class="text-sm text-slate-500">Sheet ID tidak terdeteksi.</div>'; return; }
    try{
      const res = await callAPI('getDataInventory', {}, s.sheetId).catch(()=>null);
      // getDataInventory may not be implemented on GAS: show placeholder
      if(!res || res.status==='error'){ area.innerHTML = '<div class="text-sm text-slate-500">Katalog kosong atau endpoint getDataInventory belum tersedia.</div>'; return; }
      area.innerHTML = JSON.stringify(res);
    }catch(e){ area.innerHTML = '<div class="text-sm text-red-500">Gagal muat katalog</div>'; }
  }

  // startup
  setTimeout(()=>{ var saved=localStorage.getItem('jagopos_data'); if(saved) showMain(); else showLogin(); }, 30);

})();
</script>

</body>
</html>
